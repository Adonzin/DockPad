plugins {
    id 'com.android.application'
}

def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as int

android {
    namespace 'com.adonzin.dockpad'
    compileSdk 34

    defaultConfig {
        applicationId 'com.adonzin.dockpad'
        minSdk 30
        targetSdk 34
        versionCode buildNumber
        versionName "0.1.${buildNumber}"
    }

    // One fixed signing key so every new build installs over the previous one.
    signingConfigs {
        shared {
            storeFile file('dockpad.keystore')
            storePassword 'dockpad'
            keyAlias 'dockpad'
            keyPassword 'dockpad'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            signingConfig signingConfigs.shared
            minifyEnabled false
        }
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'
}
