plugins {
    id 'com.android.application'
}

def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as int

android {
    namespace 'com.adonzin.dockpad'
    compileSdk 34

    defaultConfig {
        applicationId 'com.adonzin.dockpad'
        minSdk 30
        targetSdk 34
        versionCode buildNumber
        versionName "0.1.${buildNumber}"
        buildConfigField "String", "GIT_SHA", "\"${System.getenv('GITHUB_SHA') ?: ''}\""
    }

    // One fixed signing key so every new build installs over the previous one.
    signingConfigs {
        shared {
            storeFile file('dockpad.keystore')
            storePassword 'dockpad'
            keyAlias 'dockpad'
            keyPassword 'dockpad'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            signingConfig signingConfigs.shared
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'com.github.MuntashirAkon:sun-security-android:1.1'
}
