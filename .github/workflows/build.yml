name: Build DockPad

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          grep -E "error:|ERROR:|e: |What went wrong|AAPT|Execution failed" -A2 build.log | head -60 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line}"
          done
          grep -E ": (Error|Fatal|Warning): " build.log | head -10 | while IFS= read -r line; do echo "::error::lint: ${line}"; done
          find app/build -path "*lint*" -name "*.txt" 2>/dev/null | head -5 | while read f; do
            grep -E "Error|Fatal|\.java:" "$f" | head -20 | while IFS= read -r line; do echo "::error::lint: ${line}"; done
          done

      - name: Publish as "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk DockPad.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DockPad.apk \
            --target "$GITHUB_SHA" \
            --title "DockPad build #${{ github.run_number }}" \
            --notes "Download **DockPad.apk** below on your device and install it. Built from ${GITHUB_SHA::7}."
