name: Build DockPad

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Publish as "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DockPad.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DockPad.apk \
            --target "$GITHUB_SHA" \
            --title "DockPad build #${{ github.run_number }}" \
            --notes "Download **DockPad.apk** below on your device and install it. Built from ${GITHUB_SHA::7}."
