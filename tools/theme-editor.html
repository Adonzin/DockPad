<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DockPad Theme Editor</title>
<style>
:root{
  --bg:#0f1115;--bg2:#161a20;--bg3:#1d222a;--line:#2a313b;--fg:#e8ecf2;--dim:#9aa4b2;--acc:#7aa2ff;--acc2:#3b5bdb;--warn:#ffb86c;--bad:#ff6b6b;--ok:#69db7c;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,input{font:inherit;color:inherit}
button{background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.primary{background:var(--acc2);border-color:var(--acc2)}
button.small{padding:3px 8px;font-size:12px}
button:disabled{opacity:.4;cursor:default}
select,input[type=text],input[type=number]{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 8px;width:100%}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=checkbox]{accent-color:var(--acc);width:16px;height:16px}
header{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0 12px 0 0;font-weight:650;letter-spacing:.2px}
header h1 span{color:var(--acc)}
header .sp{flex:1}
#themeName{max-width:220px}
main{display:grid;grid-template-columns:360px 1fr;height:calc(100% - 50px)}
#side{border-right:1px solid var(--line);overflow:auto;background:var(--bg2)}
#tabs{display:flex;flex-wrap:wrap;gap:4px;padding:10px;position:sticky;top:0;background:var(--bg2);z-index:2;border-bottom:1px solid var(--line)}
#tabs button{flex:1 0 auto;padding:5px 8px;font-size:13px}
#tabs button.on{background:var(--acc2);border-color:var(--acc2)}
.panel{padding:12px 14px 40px}
.grp{margin:4px 0 14px}
.grp h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);margin:14px 0 6px}
.row{display:grid;grid-template-columns:130px 1fr;gap:8px;align-items:center;margin:6px 0}
.row label{color:var(--dim);font-size:13px}
.row .val{font-size:12px;color:var(--dim);min-width:46px;text-align:right}
.rng{display:flex;gap:8px;align-items:center}
.note{font-size:12px;color:var(--dim);margin:4px 0 8px}
.colorc{display:flex;gap:6px;align-items:center}
.colorc input[type=color]{width:38px;height:28px;border:1px solid var(--line);border-radius:6px;background:none;padding:0}
.colorc .sw{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background-image:linear-gradient(45deg,#444 25%,transparent 25%),linear-gradient(-45deg,#444 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#444 75%),linear-gradient(-45deg,transparent 75%,#444 75%);background-size:10px 10px;background-position:0 0,0 5px,5px -5px,-5px 0;position:relative;overflow:hidden}
.colorc .sw i{position:absolute;inset:0}
.colorc .alpha{width:70px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:12px}
.chip.on{border-color:var(--acc);background:#22305a}
#stage{display:flex;flex-direction:column;min-width:0}
#stagebar{display:flex;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--bg2)}
#stagebar .sp{flex:1}
#wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:18px;min-height:0;overflow:hidden;position:relative}
#device{position:relative;background:#000;border-radius:26px;padding:16px;box-shadow:0 20px 60px #0008, inset 0 0 0 2px #2a2f38}
#screen{position:relative;width:768px;height:432px;overflow:hidden;border-radius:6px;transform-origin:top left;outline:none}
#bottom{border-top:1px solid var(--line);background:var(--bg2);padding:8px 14px;max-height:170px;overflow:auto;display:grid;grid-template-columns:1fr 300px;gap:14px}
#media{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.mi{width:92px;border:1px solid var(--line);border-radius:8px;background:var(--bg);overflow:hidden;font-size:11px;position:relative}
.mi .th{height:56px;display:flex;align-items:center;justify-content:center;background:#0b0d10;color:var(--dim)}
.mi .th img,.mi .th video{max-width:100%;max-height:100%}
.mi .nm{padding:3px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .x{position:absolute;top:2px;right:2px;padding:0 5px;font-size:11px;line-height:16px}
#drop{width:92px;height:76px;border:1.5px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--dim);font-size:11px;cursor:pointer;padding:4px}
body.dragging #drop{border-color:var(--acc);color:var(--acc)}
#issues{font-size:12px}
#issues div{margin:2px 0}
#issues .w{color:var(--warn)} #issues .b{color:var(--bad)} #issues .g{color:var(--ok)}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;gap:8px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer}
.li.on{border-color:var(--acc)}
.li img{width:36px;height:36px;object-fit:contain;background:#0b0d10;border-radius:5px}
.li .t{flex:1;font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:50}
#modal .box{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:640px;width:92%;max-height:84vh;overflow:auto}
#modal h2{margin:0 0 10px;font-size:17px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--line);padding:8px 14px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.tpl{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.tpl button{text-align:left;padding:10px}
.tpl b{display:block;margin-bottom:3px}
.tpl small{color:var(--dim)}
kbd{background:var(--bg3);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11px}
/* ---------- preview (dp units = px inside #screen) ---------- */
#screen .game{position:absolute;inset:0;background-size:cover;background-position:center}
#screen .layer{position:absolute;inset:0}
.pv-panel{position:absolute;overflow:hidden;display:flex;flex-direction:column}
.pv-tint,.pv-img{position:absolute;inset:0;pointer-events:none}
.pv-img{background-size:cover;background-position:center}
.pv-content{position:relative;display:flex;flex-direction:column;min-height:0;flex:1}
.pv-title{font-size:20px;font-weight:500}
.pv-status{font-size:11px;opacity:.75;margin-bottom:6px}
.pv-sec{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin:9px 0 2px 4px;opacity:.85}
.pv-row{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px;position:relative}
.pv-row svg{width:22px;height:22px;flex:none}
.pv-row .tt{font-size:14px}
.pv-row .st{font-size:11px;opacity:.7}
.pv-badge{font-size:10px;padding:1px 6px;border-radius:9px;background:#ffffff26;margin-left:auto}
.pv-tile{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.pv-tile svg{flex:none}
.pv-tile .tt{font-weight:700;line-height:1.1;padding:0 4px;text-shadow:0 1px 3px #000a}
.pv-hint{font-size:10px;opacity:.7}
.pv-deco{position:absolute;pointer-events:none}
.pv-deco img{display:block;height:100%;width:auto}
.edit-deco .pv-deco{pointer-events:auto;cursor:move}
.pv-deco.sel{outline:2px dashed #ffd54f;outline-offset:2px}
.pv-tile,.pv-row{isolation:isolate}
.pv-btn{position:absolute;inset:0;z-index:-1;pointer-events:none;background-repeat:no-repeat;background-position:center;background-size:100% 100%;border-radius:inherit}
.pv-rot{position:absolute;left:50%;top:-26px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#ffd54f;cursor:grab}
.pv-rot:after{content:"";position:absolute;left:6px;top:14px;width:2px;height:12px;background:#ffd54f}
.pv-cursor{position:absolute;pointer-events:none;z-index:6;transition:left .11s,top .11s}
.pv-cursor img{width:100%;height:100%;object-fit:contain;display:block}
.pv-grip{position:absolute;right:-4px;bottom:-4px;width:12px;height:12px;background:#ffd54f;border-radius:3px;cursor:nwse-resize}
.free-edit .pv-tile{cursor:move}
.hl-ring:after{content:"";position:absolute;inset:-1px;border:2px solid #fff;border-radius:inherit;pointer-events:none}
</style>
</head>
<body>
<header>
  <h1>Dock<span>Pad</span> Theme Editor</h1>
  <input id="themeName" type="text" placeholder="Theme name" title="Theme name">
  <button id="btnNew">New / templates</button>
  <button id="btnOpen">Open…</button>
  <button id="btnUndo" title="Undo (Ctrl+Z)">↶</button>
  <button id="btnRedo" title="Redo (Ctrl+Y)">↷</button>
  <span class="sp"></span>
  <button id="btnJson" class="small">theme.json</button>
  <button id="btnShare">Share to catalog…</button>
  <button id="btnExport" class="primary">Save theme file</button>
  <input id="fileOpen" type="file" accept=".dockpadtheme,.zip,.json" hidden>
  <input id="fileAdd" type="file" multiple accept="image/*,video/*,audio/*,.ttf,.otf" hidden>
</header>
<main>
  <section id="side">
    <div id="tabs"></div>
    <div id="panel" class="panel"></div>
  </section>
  <section id="stage">
    <div id="stagebar">
      <button id="playOpen">▶ Open</button>
      <button id="playClose">■ Close</button>
      <button id="playMusic">♪ Music</button>
      <label class="note" style="margin:0">Game behind:</label>
      <select id="gameBg" style="width:auto"></select>
      <span class="sp"></span>
      <span class="note" style="margin:0">Click the screen, then <kbd>←↑→↓</kbd> move · <kbd>Enter</kbd> select · <kbd>Esc</kbd> back</span>
    </div>
    <div id="wrap"><div id="device"><div id="screen" tabindex="0"></div></div></div>
    <div id="bottom">
      <div>
        <div class="note" style="margin-top:0">Files in this theme: drop pictures, GIFs, videos, sounds and .ttf/.otf fonts here, then use them in the tabs on the left.</div>
        <div id="media"><div id="drop">＋ Add files<br>or drop them</div></div>
      </div>
      <div><div class="note" style="margin-top:0">Checks</div><div id="issues"></div></div>
    </div>
  </section>
</main>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>

<script>
"use strict";
/* =====================================================================
   DockPad theme editor. Everything runs in this page; nothing is uploaded.
   It mirrors DockPad's theme format (format 1, see docs/THEMES.md) and
   approximates how the quick menu draws it.
   ===================================================================== */

const W = 768, H = 432; // the Retroid Pocket 5's screen in dp (landscape)
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "style" && typeof v === "object") Object.assign(e.style, v);
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "class") e.className = v;
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
};
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.opacity = 1; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.opacity = 0, 2400); }

/* ------------------------------ the format ------------------------------ */
const LAYOUTS = [["list","List"],["compact","Compact list"],["grid","Grid of tiles"],["carousel","Carousel"],["xmb","XMB (cross bar)"],["dock","Dock"],["wheel","Wheel (vertical drum)"],["tabs","Tabs"],["rail","Rail"],["radial","Radial (ring)"],["arc","Edge arc"],["freeform","Freeform"]];
const POSITIONS = [["left","Left side"],["right","Right side"],["center","Centre"],["full","Full screen"]];
const SPOTS = [["center","Centre"],["left","Left"],["right","Right"],["top-left","Top left"],["top-right","Top right"],["bottom-left","Bottom left"],["bottom-right","Bottom right"]];
const BANDS = [["top","Top"],["middle","Middle"],["bottom","Bottom"]];
const GRADIENTS = [["none","Solid colour"],["linear","Linear gradient"],["radial","Radial gradient"],["sweep","Sweep gradient"]];
const HIGHLIGHTS = [["filled","Filled"],["outline","Outline"],["glow","Glow"],["grow","Grow"],["underline","Underline"]];
const FONTS = [["default","Default"],["condensed","Condensed"],["light","Light"],["medium","Medium"],["serif","Serif"],["mono","Monospace"],["casual","Casual"],["cursive","Handwriting"],["smallcaps","Small caps"]];
const OPENS = [["none","None"],["fade","Fade"],["slide","Slide in"],["pop","Pop"],["zoom","Zoom"],["spin","Spin (best for rings)"]];
const SPEEDS = [["fast","Fast"],["normal","Normal"],["slow","Slow"]];
const ITEMSFX = [["none","All at once"],["stagger","One after another"]];
const MOTIONS = [["none","None"],["bump","Bump"],["hop","Hop"],["wiggle","Wiggle"],["shake","Shake"],["jelly","Jelly"],["flip","Flip"],["spin","Spin"],["flash","Flash"],["pulse","Pulse (keeps going)"],["float","Float (keeps going)"],["sway","Sway (keeps going)"]];
const PACKS = [["off","Off"],["soft","Soft"],["retro","Retro"],["glass","Glass"],["click","Clicky"]];
const EVENTS = [["open","Opening"],["close","Closing"],["move","Moving"],["select","Selecting"],["back","Back"]];
const HAPTICS = [["off","Off"],["select","When selecting"],["all","When moving and selecting"]];
const ANCHORS = [["top-left","Top left"],["top","Top"],["top-right","Top right"],["left","Left"],["center","Centre"],["right","Right"],["bottom-left","Bottom left"],["bottom","Bottom"],["bottom-right","Bottom right"]];
const DMOTIONS = [["none","Still"],["float","Float"],["sway","Sway"],["spin","Spin"],["pulse","Pulse"],["blink","Blink"],["drift","Drift across"]];
const DSPEEDS = [["slow","Slow"],["normal","Normal"],["fast","Fast"]];
const SIDES = [["left","Left of it"],["right","Right of it"],["top","Above it"],["bottom","Below it"]];
const CMOTIONS = [["none","Still"],["bob","Bob"],["pulse","Pulse"],["spin","Spin"]];
// every item DockPad can show (their ids), for per-item pictures
const ITEM_IDS = [["home","Home"],["back","Back"],["cursor","Cursor mode"],["turbo","Rapid fire"],["turboedit","Rapid fire buttons (edit)"],["nintendo","Nintendo layout"],["swapab","Swap A/B"],["swapxy","Swap X/Y"],["dpkeyboard","Keyboard (DockPad)"],["keyboard","Show keyboard (Moonlight)"],["screenshot","Screenshot"],["forceclose","Force close the game"],["controllers","Every controller entry"],["pair","Pair a new controller"],["theme","Switch theme"],["power","Turn DockPad on/off"],["openapp","Open DockPad"],["commands","Every one of your own commands"]];
const REPEATS = [["none","Once"],["across","Repeat across"],["down","Repeat down"]];
// name, panel1, panel2, gradient, angle, accent, text, tile  (same as DockPad)
const PALETTES = [
  ["system","Follow the system","","","none",90,"","",""],
  ["midnight","Midnight","#0E1116","","none",90,"#8AB4F8","#FFFFFF","#22FFFFFF"],
  ["ocean","Ocean","#0F2027","#2C5364","linear",90,"#4FD1C5","#FFFFFF","#26FFFFFF"],
  ["sunset","Sunset","#2B1055","#D53369","linear",135,"#FFB86C","#FFFFFF","#26FFFFFF"],
  ["forest","Forest","#0B1F14","#1E3D2A","linear",90,"#7EE787","#EFFFF2","#22FFFFFF"],
  ["neon","Neon","#0D0221","#261447","radial",90,"#FF2A6D","#05D9E8","#2205D9E8"],
  ["retro","Retro terminal","#050A05","","none",90,"#39FF14","#39FF14","#1A39FF14"],
  ["candy","Candy (light)","#FFDEE9","#B5FFFC","linear",45,"#D6336C","#2B2B2B","#55FFFFFF"],
  ["paper","Paper (light)","#F4F1EA","","none",90,"#3B5BDB","#1F1F1F","#14000000"],
  ["mono","Black & white","#000000","","none",90,"#FFFFFF","#FFFFFF","#26FFFFFF"],
  ["aurora","Aurora","#0B132B","#1C7C54","sweep",90,"#73E2A7","#FFFFFF","#22FFFFFF"]];
const SYSTEM_ACCENT = "#A8C7FA", SYSTEM_FILL = "#284777"; // stand-ins for the handheld's own colours

function defaults() {
  return {
    format: 1, name: "My theme", author: "", description: "",
    layout: {type: "list", position: "left", width: 340, sections: true, columns: 3, band: "bottom", spot: "center", size: 80, free: {}},
    style: {palette: "system", panel1: "", panel2: "", panel3: "", gradient: "none", angle: 90, accent: "", text: "", tile: "",
      opacity: 90, dim: -1, corners: 24, border: 0, borderColor: "", edgeOpacity: 100, glow: false, backdrop: "",
      textSize: 100, font: "default", highlight: "filled", showTitle: true, showStatus: true, showClock: false, showBattery: false},
    media: {background: {file: "", target: "screen", scale: "fill", blur: 0, dim: 0}, decorations: []},
    fx: {open: "none", close: "none", speed: "normal", intensity: 100, items: "none", highlight: "none", pack: "off", sounds: {},
      volume: 70, music: "", musicVolume: 40, haptics: "off", hapticStrength: 50},
    art: {button: "", buttonOn: "", slice: 0, labels: true, items: {}, cursor: {file: "", side: "left", size: 70, motion: "bob"}}
  };
}
const ids = a => a.map(x => x[0]);
const one = (v, opts, d) => ids(opts).includes(v) ? v : d;
const num = (v, lo, hi, d) => { v = Number(v); return Number.isFinite(v) ? clamp(Math.round(v), lo, hi) : d; };
const color = s => (typeof s === "string" && /^#([0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/.test(s.trim())) ? s.trim().toUpperCase() : "";
const safeName = n => (typeof n === "string" && /^[A-Za-z0-9._ -]{1,80}$/.test(n)) ? n : "";

/** Cleans a theme the same way DockPad does (unknown or out-of-range values fall back). */
function sanitize(src) {
  const d = defaults(), o = src || {};
  const L = o.layout || {}, S = o.style || {}, M = o.media || {}, F = o.fx || {};
  const t = d;
  t.name = String(o.name || d.name).slice(0, 40); t.author = String(o.author || "").slice(0, 40); t.description = String(o.description || "").slice(0, 160);
  Object.assign(t.layout, {type: one(L.type, LAYOUTS, "list"), position: one(L.position, POSITIONS, "left"), width: num(L.width, 200, 1200, 340),
    sections: L.sections !== false, columns: num(L.columns, 2, 8, 3), band: one(L.band, BANDS, "bottom"), spot: one(L.spot, SPOTS, "center"), size: num(L.size, 40, 100, 80), free: {}});
  if (L.free && typeof L.free === "object") for (const [k, r] of Object.entries(L.free)) if (Array.isArray(r) && r.length === 4)
    t.layout.free[k] = r.map(x => clamp(Number(x) || 0, 0, 1)).map((x, i) => i === 2 ? Math.max(.04, x) : i === 3 ? Math.max(.03, x) : x);
  const s = t.style;
  s.palette = String(S.palette || "system");
  for (const k of ["panel1","panel2","panel3","accent","text","tile","borderColor","backdrop"]) s[k] = color(S[k]);
  s.gradient = one(S.gradient, GRADIENTS, "none"); s.angle = num(S.angle, 0, 359, 90);
  s.opacity = num(S.opacity, 10, 100, 90); s.dim = num(S.dim, -1, 95, -1); s.corners = num(S.corners, 0, 48, 24);
  s.border = num(S.border, 0, 8, 0); s.edgeOpacity = num(S.edgeOpacity, 0, 100, 100); s.glow = !!S.glow;
  s.textSize = num(S.textSize, 70, 160, 100);
  s.font = (typeof S.font === "string" && /^file:[A-Za-z0-9._ -]{1,60}$/.test(S.font)) ? S.font : one(S.font, FONTS, "default");
  s.highlight = one(S.highlight, HIGHLIGHTS, "filled");
  for (const k of ["showTitle","showStatus"]) s[k] = S[k] !== false;
  for (const k of ["showClock","showBattery"]) s[k] = !!S[k];
  const b = M.background || {};
  t.media.background = {file: safeName(b.file), target: one(b.target, [["screen"],["panel"]], "screen"), scale: one(b.scale, [["fill"],["fit"]], "fill"),
    blur: num(b.blur, 0, 25, 0), dim: num(b.dim, 0, 90, 0)};
  t.media.decorations = (Array.isArray(M.decorations) ? M.decorations : []).slice(0, 30).map(x => ({
    file: safeName(x && x.file), anchor: one(x && x.anchor, ANCHORS, "bottom-right"), x: num(x && x.x, -100, 100, 0), y: num(x && x.y, -100, 100, 0),
    size: num(x && x.size, 2, 100, 25), opacity: num(x && x.opacity, 5, 100, 100), front: !!(x && x.front), repeat: one(x && x.repeat, REPEATS, "none"),
    mirror: !!(x && x.mirror), rotation: num(x && x.rotation, -180, 180, 0), flip: !!(x && x.flip),
    motion: one(x && x.motion, DMOTIONS, "none"), motionSpeed: one(x && x.motionSpeed, DSPEEDS, "normal")})).filter(x => x.file);
  const f = t.fx;
  f.open = one(F.open, OPENS, "none"); f.close = one(F.close, OPENS, "none"); f.speed = one(F.speed, SPEEDS, "normal");
  f.intensity = num(F.intensity, 10, 200, 100); f.items = one(F.items, ITEMSFX, "none"); f.highlight = one(F.highlight, MOTIONS, "none");
  f.pack = one(F.pack, PACKS, "off"); f.sounds = {};
  if (F.sounds && typeof F.sounds === "object") for (const [k, v] of Object.entries(F.sounds)) {
    if (!ids(EVENTS).includes(k) || typeof v !== "string") continue;
    if (v === "" || (v.startsWith("pack:") && ids(PACKS).includes(v.slice(5))) || (v.startsWith("file:") && safeName(v.slice(5)))) f.sounds[k] = v;
  }

/* ------------------------------ checks ------------------------------ */
function checks() {
  const box = $("#issues"); box.innerHTML = "";
  const out = [];
  let total = 0;
  for (const n of used()) {
    const m = media.get(n);
    if (!m) out.push(["b", "Missing file: " + n + " (add it, or it'll be left out)"]);
    else { total += m.size; if (m.size > 150e6) out.push(["b", n + " is over 150 MB: DockPad won't install it"]); }
  }
  if (total > 300e6) out.push(["b", "Files add up to over 300 MB: DockPad won't install the theme"]);
  const bg = T.media.background, bm = media.get(bg.file);
  if (bm && bm.kind === "video" && bg.target === "panel") out.push(["w", "Video backgrounds play on the whole screen, not in the panel"]);
  if (T.media.decorations.length >= 30) out.push(["w", "30 decorations is the most DockPad shows"]);
  const unused = [...media.keys()].filter(n => !used().has(n));
  if (unused.length) out.push(["w", unused.length + " file" + (unused.length > 1 ? "s" : "") + " not used yet (left out of the theme file)"]);
  if (!out.length) out.push(["g", "All good · " + (total ? kb(total) + " of files" : "no files")]);
  else if (total) out.push(["g", kb(total) + " of files in the theme"]);
  for (const [c, t] of out) box.append(el("div", {class: c}, (c === "g" ? "✓ " : c === "w" ? "⚠ " : "✕ ") + t));
}

    c.setUint16(28, nm.length, true); c.setUint32(42, off, true);
    central.push(new Uint8Array(c.buffer), nm);
    off += 30 + nm.length + sz;
  }
  const cdSize = central.reduce((s, x) => s + x.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, cdSize, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...central, new Uint8Array(e.buffer)], {type: "application/zip"});
}
async function readZip(buf) {
  const u = new Uint8Array(buf), dv = new DataView(buf), out = [];
  let e = -1; for (let i = u.length - 22; i >= Math.max(0, u.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }
  if (e < 0) throw new Error("not a zip file");
  const count = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true);
  const dec = new TextDecoder();
  for (let k = 0; k < count; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true), nlen = dv.getUint16(p + 28, true),
      xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), loc = dv.getUint32(p + 42, true);
    const name = dec.decode(u.subarray(p + 46, p + 46 + nlen));
    p += 46 + nlen + xlen + clen;
    const start = loc + 30 + dv.getUint16(loc + 26, true) + dv.getUint16(loc + 28, true);
    const raw = u.subarray(start, start + csize);
    let data;
    if (method === 0) data = raw.slice();
    else if (method === 8) {
      if (!("DecompressionStream" in window)) throw new Error("this browser can't unpack compressed files; try Chrome, Edge or Firefox");
      data = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
    } else continue;
    out.push({name, data});
  }
  return out;
}

async function openThemeFile(file) {
  try {
    if (file.name.endsWith(".json")) { newTheme(sanitize(JSON.parse(await file.text())), false); toast("Opened " + file.name); return; }
    const entries = await readZip(await file.arrayBuffer());
    const tj = entries.find(e => e.name === "theme.json"); if (!tj) throw new Error("no theme.json inside");
    const theme = sanitize(JSON.parse(new TextDecoder().decode(tj.data)));
    clearMedia();
    for (const e of entries) if ((e.name.startsWith("media/") || e.name.startsWith("fonts/")) && safeName(e.name.slice(6)))
      await addFile(new Blob([e.data]), e.name.slice(6), true);
    newTheme(theme, false); mediaBar(); checks();
    toast("Opened " + theme.name);

}

async function saveBlob(name, blob, fallbackExt) {
  // inside claude.ai the page offers files through the viewer; elsewhere, a normal download
  let dl = null;
  try { if (window.claude && window.claude.use) dl = await window.claude.use("downloads"); } catch (e) {}
  if (dl) {
    try { await dl.save({filename: fallbackExt ? name + fallbackExt : name, data: blob}); toast("Saved"); }
    catch (e) { if (e && e.code !== "declined") toast("Couldn't save: " + (e.message || e.code)); }
    return;
  }
  const a = el("a", {href: URL.createObjectURL(blob), download: name}); document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
async function buildTheme() {
  const theme = sanitize(T), enc = new TextEncoder(), files = [{name: "theme.json", data: enc.encode(JSON.stringify(theme, null, 2))}];
  for (const n of used()) {

}

const toDataUrl = blob => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => res(""); r.readAsDataURL(blob); });
/** A 1536×864 PNG of the preview screen, as it looks right now. */
async function previewPng() {
  const live = $("#screen"), clone = live.cloneNode(true);
  clone.style.transform = "none"; clone.removeAttribute("tabindex");
  clone.querySelectorAll(".pv-grip,.pv-rot").forEach(e => e.remove());
  clone.querySelectorAll(".sel").forEach(e => e.classList.remove("sel"));
  const urls = new Map();
  for (const m of media.values()) if (m.kind === "image") urls.set(m.url, await toDataUrl(m.blob));
  if (gameUrl) { try { urls.set(gameUrl, await toDataUrl(await (await fetch(gameUrl)).blob())); } catch (e) {} }
  const swap = v => { for (const [u, d] of urls) v = v.split(u).join(d); return v; };
  clone.querySelectorAll("img").forEach(i => { i.setAttribute("src", swap(i.getAttribute("src") || "")); });
  clone.querySelectorAll("[style]").forEach(e => e.setAttribute("style", swap(e.getAttribute("style"))));
  // videos: their current frame
  const vids = live.querySelectorAll("video"), cvids = clone.querySelectorAll("video");
  vids.forEach((v, k) => {
    try { const c = document.createElement("canvas"); c.width = v.videoWidth || 640; c.height = v.videoHeight || 360; c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
      const im = document.createElement("img"); im.setAttribute("src", c.toDataURL("image/jpeg", .85)); im.setAttribute("style", cvids[k].getAttribute("style") || ""); cvids[k].replaceWith(im); }
    catch (e) { cvids[k].remove(); }
  });
  let fontCss = "";
  for (const [n, m] of media) if (m.kind === "font") fontCss += `@font-face{font-family:"${fontFamily(n)}";src:url(${await toDataUrl(m.blob)})}`;
  const css = document.querySelector("style").textContent + fontCss;
  const xhtml = new XMLSerializer().serializeToString(clone);
  const svgText = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" style="font:14px/1.4 system-ui,sans-serif;color:#e8ecf2"><style>${css.replace(/</g, "\\3c ")}</style>${xhtml}</div></foreignObject></svg>`;
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error("couldn't draw the preview")); img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgText); });
  const c = document.createElement("canvas"); c.width = W * 2; c.height = H * 2;
  const g = c.getContext("2d"); g.scale(2, 2); g.drawImage(img, 0, 0);
  return new Promise((res, rej) => { try { c.toBlob(b => b ? res(b) : rej(new Error("couldn't make the picture")), "image/png"); } catch (e) { rej(e); } });
}

/* ------------------------------ share to the catalog (a GitHub pull request) ------------------------------ */
const REPO = "Adonzin/DockPad";
async function gh(token, path, opts = {}) {
  const r = await fetch("https://api.github.com" + path, {method: opts.method || "GET", headers: {Authorization: "Bearer " + token,
    Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(opts.body ? {"Content-Type": "application/json"} : {})},
    body: opts.body ? JSON.stringify(opts.body) : undefined});
  const txt = await r.text(); let data = null; try { data = txt ? JSON.parse(txt) : null; } catch (e) {}
  if (!r.ok) { const e = new Error((data && data.message) || ("GitHub said " + r.status)); e.status = r.status; throw e; }
  return data;
}
const b64 = async blob => { const d = await toDataUrl(blob); return d.slice(d.indexOf(",") + 1); };
const b64text = t => btoa(unescape(encodeURIComponent(t)));
const fromB64 = s => decodeURIComponent(escape(atob(s.replace(/\n/g, ""))));

async function shareToCatalog(token, id, pvBlob, say, linkBox) {
  if (!/^[a-z0-9][a-z0-9-]{1,29}$/.test(id)) throw new Error("the id needs 2–30 letters, numbers or dashes");
  say("Packing the theme…");
  const themeBlob = await buildTheme();
  if (themeBlob.size > 50e6) throw new Error("catalog themes can be up to 50 MB; this one is " + kb(themeBlob.size));
  say("Signing in to GitHub…");
  const me = await gh(token, "/user");
  const repo = await gh(token, "/repos/" + REPO);
  const canPush = !!(repo.permissions && repo.permissions.push);
  let target = REPO;
  if (!canPush) {
    say("Making your copy of the catalog…");
    const fork = await gh(token, "/repos/" + REPO + "/forks", {method: "POST", body: {default_branch_only: true}});
    target = fork.full_name;
    for (let i = 0; i < 20; i++) { try { await gh(token, "/repos/" + target + "/git/ref/heads/" + repo.default_branch); break; } catch (e) { await new Promise(r => setTimeout(r, 1500)); } }
  }
  const base = repo.default_branch;
  const head = await gh(token, "/repos/" + REPO + "/git/ref/heads/" + base);
  const baseCommit = await gh(token, "/repos/" + REPO + "/git/commits/" + head.object.sha);
  // the catalog list, with this theme added (or updated)
  const cur = await gh(token, "/repos/" + REPO + "/contents/catalog/index.json?ref=" + base);
  const index = JSON.parse(fromB64(cur.content));
  const theme = sanitize(T);
  const entry = {id, name: theme.name, author: theme.author || me.login, description: theme.description, layout: theme.layout.type,
    file: `catalog/${id}/${id}.dockpadtheme`, preview: `catalog/${id}/preview.png`, size: themeBlob.size};
  const at = index.themes.findIndex(x => x.id === id);
  if (at >= 0 && index.themes[at].author !== entry.author && !canPush) throw new Error(`"${id}" is already in the catalog by someone else: choose another id`);
  if (at >= 0) index.themes[at] = entry; else index.themes.push(entry);
  say("Uploading the theme…");
  const blob = async (content, encoding) => (await gh(token, "/repos/" + target + "/git/blobs", {method: "POST", body: {content, encoding}})).sha;
  const tree = await gh(token, "/repos/" + target + "/git/trees", {method: "POST", body: {base_tree: baseCommit.tree.sha, tree: [
    {path: entry.file, mode: "100644", type: "blob", sha: await blob(await b64(themeBlob), "base64")},
    {path: entry.preview, mode: "100644", type: "blob", sha: await blob(await b64(pvBlob), "base64")},
    {path: "catalog/index.json", mode: "100644", type: "blob", sha: await blob(b64text(JSON.stringify(index, null, 2) + "\n"), "base64")}]}});
  const commit = await gh(token, "/repos/" + target + "/git/commits", {method: "POST", body: {message: `Catalog: ${at >= 0 ? "update" : "add"} ${theme.name}`, tree: tree.sha, parents: [head.object.sha]}});
  const branch = "theme-" + id + "-" + Date.now().toString(36);
  await gh(token, "/repos/" + target + "/git/refs", {method: "POST", body: {ref: "refs/heads/" + branch, sha: commit.sha}});
  say("Sending it in…");
  const pr = await gh(token, "/repos/" + REPO + "/pulls", {method: "POST", body: {title: `Catalog: ${theme.name}`, base,
    head: canPush ? branch : me.login + ":" + branch,
    body: `${at >= 0 ? "Updates" : "Adds"} **${theme.name}** by ${entry.author} to the theme catalog.\n\n> ${theme.description || "(no description)"}\n\nLayout: ${entry.layout} · ${kb(themeBlob.size)}\n\nSent from the DockPad theme editor.`}});
  linkBox.innerHTML = "";
  linkBox.append(el("a", {href: pr.html_url, target: "_blank", style: {color: "var(--acc)"}}, "See it on GitHub (#" + pr.number + ")"));
  if (canPush) {
    say("Sent in. You look after the catalog, so you can publish it now.");
    linkBox.append(" ", el("button", {class: "small primary", onclick: async e => {
      e.target.disabled = true;
      try {
        try { await gh(token, `/repos/${REPO}/pulls/${pr.number}/merge`, {method: "PUT", body: {merge_method: "squash"}}); }
        catch (m) { if (m.status !== 405) throw m; await gh(token, `/repos/${REPO}/pulls/${pr.number}/merge`, {method: "PUT", body: {merge_method: "merge"}}); }
        try { await gh(token, `/repos/${REPO}/git/refs/heads/${branch}`, {method: "DELETE"}); } catch (x) {}
        say("Published! It shows in DockPad's Get themes… within a few minutes."); }
      catch (x) { say("Couldn't publish: " + x.message); e.target.disabled = false; }
    }}, "Publish now"));
  } else say("Sent in! It appears in the catalog once it's been checked.");
}

/* templates: DockPad's built-in themes */
function templates() {
  const d = () => defaults();

  return [
    mk("Default", "The classic side panel in system colours.", () => {}),
    mk("Glass", "See-through centred grid, glow highlight, glass sounds.", t => { Object.assign(t.layout, {type: "grid", position: "center", width: 560, columns: 4}); pal(t, "midnight");
      Object.assign(t.style, {palette: "custom", panel1: "#33FFFFFF", panel2: "#1AFFFFFF", gradient: "linear", angle: 270, opacity: 100, corners: 32, border: 1, borderColor: "#66FFFFFF", highlight: "glow", tile: "#1AFFFFFF", dim: 45, showClock: true});
      Object.assign(t.fx, {open: "pop", close: "fade", items: "stagger", pack: "glass"}); }),
    mk("Retro terminal", "Green phosphor, monospace, chiptune bleeps.", t => { Object.assign(t.layout, {type: "compact", width: 380}); pal(t, "retro");
      Object.assign(t.style, {corners: 0, border: 2, borderColor: "#39FF14", font: "mono", highlight: "outline", showClock: true, showBattery: true});
      Object.assign(t.fx, {open: "slide", close: "slide", speed: "fast", highlight: "flash", pack: "retro"}); }),
    mk("Neon ring", "Glowing radial menu that spins in.", t => { Object.assign(t.layout, {type: "radial", size: 85}); pal(t, "neon");
      Object.assign(t.style, {glow: true, highlight: "glow", font: "condensed", backdrop: "#0D0221", dim: 70}); Object.assign(t.fx, {open: "spin", close: "zoom", highlight: "pulse", pack: "glass"}); }),
    mk("Console", "XMB: sections across, items down.", t => { Object.assign(t.layout, {type: "xmb", size: 80}); pal(t, "ocean");
      Object.assign(t.style, {opacity: 85, showClock: true, showBattery: true}); Object.assign(t.fx, {open: "fade", close: "fade", highlight: "bump", pack: "soft"}); }),
    mk("Sunset dock", "A small dock along the bottom.", t => { Object.assign(t.layout, {type: "dock", band: "bottom", size: 70}); pal(t, "sunset");
      Object.assign(t.style, {corners: 28, dim: 25}); Object.assign(t.fx, {open: "slide", close: "slide", highlight: "hop", pack: "soft"}); })];
}
